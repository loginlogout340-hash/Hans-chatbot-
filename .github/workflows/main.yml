name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p /tmp/www
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' ./ /tmp/www/
          mkdir www
          cp -r /tmp/www/. www/

      - name: Create Android project
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Hans Chatbot" com.hans.chatbot --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hans Chatbot v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
